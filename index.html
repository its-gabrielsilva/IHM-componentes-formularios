<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inatel - Início</title>
  <link rel="stylesheet" href="styles_pagina.css">
</head>
<body>
  <div class="app">

    <!-- Cabeçalho -->
    <header class="topo">
      <button class="icone-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <h1 class="logo">Inatel</h1>
      <button class="icone-btn" aria-label="Perfil">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </button>
    </header>

    <!-- Saudação -->
    <section class="cartao saudacao">
      <h2>Olá, Gabriel!</h2>
      <p class="aviso">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <span>Você possui um armário reservado com entrega para hoje...</span>
      </p>
      <p class="aviso">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
        <span>Você possui uma pendência no financeiro...</span>
      </p>
    </section>

    <!-- Componente das aulas (exercício) -->
    <aulas-component id="componente"></aulas-component>

    <!-- Carrossel de eventos -->
    <section class="cartao carrossel">
      <div class="slides" id="slides"></div>
      <button class="seta esquerda" id="anterior" aria-label="Anterior">&#8249;</button>
      <button class="seta direita" id="proximo" aria-label="Próximo">&#8250;</button>
      <div class="evento-info">
        <h3 id="evento-titulo"></h3>
        <p id="evento-descricao"></p>
        <div class="evento-meta">
          <span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span id="evento-data"></span>
          </span>
          <span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
            </svg>
            <span id="evento-local"></span>
          </span>
        </div>
      </div>
    </section>

  </div>

  <!-- O script do componente deve ficar depois do componente -->
  <script src="script_componente.js"></script>
  <script src="script_pagina.js"></script>
</body>
</html>
